<!DOCTYPE html>
<html>
<head>
  <!--
    웹 앱을 루트가 아닌 경로에서 제공한다면 아래 href 값을 실제 기본
    경로에 맞게 바꾼다.

    아래 경로는 올바르게 동작하도록 슬래시 "/"로 시작하고 끝나야 한다.

    자세한 내용:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    이 값은 `flutter build`에서 전달한 `--base-href` 인수 값으로 대체되는
    기본 href 자리표시자다.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Moduly는 일상 일정을 함께 관리하는 플래너입니다.">
  <!-- 초대 토큰이 referrer 헤더로 전달되면 안 된다. -->
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Referrer-Policy" content="no-referrer">

  <!-- iOS 메타 태그 및 아이콘 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Moduly">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- 파비콘 -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Moduly</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    "flutter_bootstrap.js" 스크립트를 맞춤 설정할 수 있다.
    Flutter 로더에 맞춤 설정을 제공하거나 초기화 중 사용자에게 상태를
    알릴 때 유용하다.

    자세한 내용:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
