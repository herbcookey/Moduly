name: moduly
description: "Moduly is a collaborative planner for everyday schedules."
# 다음 줄은 `flutter pub publish`로 패키지가 실수로 pub.dev에 게시되는 것을
# 막는다. 비공개 패키지에 권장되는 설정이다.
publish_to: 'none' # pub.dev에 게시하려면 이 줄을 제거한다.

# 다음은 앱의 버전과 빌드 번호를 정의한다.
# 버전 번호는 1.2.43처럼 점으로 구분한 세 숫자이며, + 뒤에 선택적인
# 빌드 번호를 붙일 수 있다.
# flutter build에서 각각 --build-name과 --build-number를 지정해 버전과
# 빌드 번호를 덮어쓸 수 있다.
# Android에서는 build-name을 versionName으로, build-number를 versionCode로 사용한다.
# Android 버전 관리 자세한 내용: https://developer.android.com/studio/publish/versioning
# iOS에서는 build-name을 CFBundleShortVersionString으로, build-number를
# CFBundleVersion으로 사용한다.
# iOS 버전 관리 자세한 내용:
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# Windows에서는 build-name을 제품 및 파일 버전의 major, minor, patch로 사용하고
# build-number를 빌드 접미사로 사용한다.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# dependencies에는 패키지가 동작하는 데 필요한 다른 패키지를 지정한다.
# 의존성을 최신 버전으로 자동 업그레이드하려면 `flutter pub upgrade
# --major-versions`를 실행한다. 아래 버전 번호를 pub.dev의 최신 버전으로
# 직접 바꿔 수동으로 갱신할 수도 있다. 최신 버전이 있는 의존성을 확인하려면
# `flutter pub outdated`를 실행한다.
dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # 다음은 앱에 Cupertino Icons 글꼴을 추가한다.
  # iOS 스타일 아이콘에는 CupertinoIcons 클래스를 사용한다.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.0
  supabase_flutter: ^2.9.1
  # Deep-link intake is shared with Supabase auth, but declared directly so
  # invite routing has an explicit, locked API dependency.
  app_links: 7.2.1
  # Native OS share sheet with a web/text fallback.
  share_plus: 13.3.0
  # Browser Web Share API bindings used by the share adapter.
  web: 1.1.1
  intl: ^0.20.2
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # 아래 "flutter_lints" 패키지는 좋은 코딩 습관을 권장하는 린트 모음을
  # 제공한다. 패키지가 제공하는 린트는 패키지 루트의
  # `analysis_options.yaml`에서 활성화한다. 특정 린트를 끄거나 추가 린트를
  # 켜는 방법은 해당 파일을 참고한다.
  flutter_lints: ^6.0.0

# 이 파일의 일반적인 Dart 부분은 다음 문서를 참고한다:
# https://dart.dev/tools/pub/pubspec

# 다음 섹션은 Flutter 패키지 전용이다.
flutter:

  # 다음 줄은 Material Icons 글꼴을 앱에 포함해 material Icons 클래스의
  # 아이콘을 사용할 수 있게 한다.
  uses-material-design: true

  # 앱에 자산을 추가하려면 다음처럼 assets 섹션을 추가한다.
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # 이미지 자산은 해상도별 "variants"를 하나 이상 참조할 수 있다(참고:
  # https://flutter.dev/to/resolution-aware-images

  # 패키지 의존성에서 자산을 가져오는 자세한 방법은 다음을 참고한다.
  # https://flutter.dev/to/asset-from-package

  # 앱에 맞춤 글꼴을 추가하려면 이 "flutter" 섹션에 fonts 섹션을 추가한다.
  # 목록의 각 항목에는 글꼴 패밀리 이름을 담은 "family" 키와 글꼴 자산 및
  # 기타 설명자를 담은 "fonts" 키가 있어야 한다. 예:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # 패키지 의존성에서 글꼴을 가져오는 자세한 방법은 다음을 참고한다.
  # https://flutter.dev/to/font-from-package
